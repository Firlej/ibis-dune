name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package and dev tools
        run: pip install -e ".[dev]"

      - name: Run offline tests
        run: pytest -m "not integration and not trino and not parity_mock" -q

      - name: Build distribution artifacts
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Require curated release notes
        run: |
          NOTES_FILE=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "Missing release notes file: $NOTES_FILE"
            echo "Copy .github/release-template.md and fill it in before tagging."
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: dist/*
          generate_release_notes: false
